services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecocampus}
      POSTGRES_USER: ${DB_USER:-eco_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeThisLocal123}
    volumes:
      - eco_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eco_user} -d ${DB_NAME:-ecocampus}"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecocampus}
      DB_USER: ${DB_USER:-eco_user}
      DB_PASSWORD: ${DB_PASSWORD:-ChangeThisLocal123}
    depends_on:
      db:
        condition: service_healthy
    networks: [web, data]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [backend]
    networks: [web]
networks:
  web: {}
  data:
    internal: true
volumes:
  eco_data: {}
